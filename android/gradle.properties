############################################
# AndroidX
############################################
android.useAndroidX=true
android.enableJetifier=true

############################################
# Gradle performance
############################################
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

############################################
# 🔥 CRITICAL CI FIXES (DO NOT REMOVE)
############################################

# 1️⃣ Fix GitHub Actions / CI 403 (HEAD requests blocked)
systemProp.gradle.internal.http.disableHead=true

# 2️⃣ OVERRIDE Gradle embedded Kotlin (THIS FIXES 1.8.20)
# Gradle 8.2 embeds Kotlin 1.8.20 internally.
# This forces Gradle Kotlin DSL + classpath to use 1.9.22 instead.
org.gradle.kotlin.dsl.embedded.kotlin.version=1.9.22
org.gradle.kotlin.dsl.provider.override.embedded=true
############################################
# Kotlin version MUST be managed via
# settings.gradle.kts pluginManagement ONLY
############################################
# ❌ DO NOT add kotlin.version
# ❌ DO NOT add ext.kotlin_version
