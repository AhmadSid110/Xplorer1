name: Android Auto Release

on:
  push:
    tags:
      - "v*.*.*"        # v1.0.0, v1.2.3 etc
  workflow_dispatch:    # manual trigger

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # ─────────────────────────────────────────────
      # 1️⃣ Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2️⃣ Extract version from tag
      # ─────────────────────────────────────────────
      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "VERSION_NAME=$TAG" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "VersionName=$TAG"
          echo "VersionCode=$VERSION_CODE"

      # ─────────────────────────────────────────────
      # 3️⃣ Java 17
      # ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ─────────────────────────────────────────────
      # 4️⃣ Android SDK (SAFE INSTALL)
      # ─────────────────────────────────────────────
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip

          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/
          rm -rf cmdline-tools tools.zip

          yes | cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ─────────────────────────────────────────────
      # 5️⃣ local.properties
      # ─────────────────────────────────────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ─────────────────────────────────────────────
      # 6️⃣ Gradle properties (NO kotlin.version)
      # ─────────────────────────────────────────────
      - name: Write gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          EOF

      # ─────────────────────────────────────────────
      # 7️⃣ Build APK
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionName=$VERSION_NAME \
            -PversionCode=$VERSION_CODE \
            --no-daemon

      # ─────────────────────────────────────────────
      # 8️⃣ Verify output
      # ─────────────────────────────────────────────
      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # ─────────────────────────────────────────────
      # 9️⃣ Upload to GitHub Release
      # ─────────────────────────────────────────────
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Xplorer v${{ env.VERSION_NAME }}
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk