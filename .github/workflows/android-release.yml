name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Versioning
      # -------------------------
      - name: Extract version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION="dev-${GITHUB_RUN_NUMBER}"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Using version: $VERSION"

      # -------------------------
      # Java 17
      # -------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
      # Android SDK
      # -------------------------
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -q tools.zip -d cmdline-tools-temp

          mkdir -p cmdline-tools/latest
          mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/

          rm -rf cmdline-tools-temp tools.zip

          yes | cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # -------------------------
      # local.properties
      # -------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # -------------------------
      # gradle.properties
      # -------------------------
      - name: Write gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          EOF

      # -------------------------
      # Verify Gradle model (debug)
      # -------------------------
      - name: Show Gradle projects
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew projects

      # -------------------------
      # Build (CORRECT for your project)
      # -------------------------
      - name: Build APK
        working-directory: android
        run: |
          ./gradlew build \
            -PversionName=$APP_VERSION \
            --no-daemon

      # -------------------------
      # Locate APK
      # -------------------------
      - name: Locate APK
        run: |
          echo "APK files found:"
          find android -type f -name "*.apk"

      # -------------------------
      # Upload APK on tag
      # -------------------------
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Xplorer v${{ env.APP_VERSION }}
          prerelease: true
          files: |
            android/**/*.apk
