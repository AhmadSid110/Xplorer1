name: Android Release Build

on:
  # 🔹 Automatic trigger via version tags
  push:
    tags:
      - "v*.*.*"

  # 🔹 Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0.2). Leave empty to use tag."
        required: false

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # -------------------------
      # Checkout (tags REQUIRED)
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Resolve Version (TAG or MANUAL)
      # -------------------------
      - name: Resolve version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version = $VERSION"

      # -------------------------
      # Java 17 (MATCHES MODAL)
      # -------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
# Android SDK (FIXED)
# -------------------------
- name: Install Android SDK
  run: |
    mkdir -p $ANDROID_SDK_ROOT
    cd $ANDROID_SDK_ROOT

    curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip

    rm -rf cmdline-tools-temp
    unzip -q tools.zip -d cmdline-tools-temp

    mkdir -p cmdline-tools/latest
    mv cmdline-tools-temp/cmdline-tools/* cmdline-tools/latest/

    rm -rf cmdline-tools-temp tools.zip

    yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
      --sdk_root=$ANDROID_SDK_ROOT \
      "platform-tools" \
      "platforms;android-34" \
      "build-tools;34.0.0"

      # -------------------------
      # local.properties (CRITICAL)
      # -------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # -------------------------
      # gradle.properties (ANDROIDX FIX)
      # -------------------------
      - name: Ensure gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF

      # -------------------------
      # Build APK (NO CLEAN)
      # -------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PversionName=$APP_VERSION

      # -------------------------
      # Verify APK
      # -------------------------
      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # -------------------------
      # Upload to GitHub Release
      # -------------------------
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
