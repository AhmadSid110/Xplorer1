name: Android Debug APK (Release)

on:
  push:
    tags:
      - "debug-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /sdk
      ANDROID_HOME: /sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # -----------------------------
      # Checkout (FULL HISTORY NEEDED)
      # -----------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Java 17 (MATCH MODAL)
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -----------------------------
      # Android SDK (MANUAL, STABLE)
      # -----------------------------
      - name: Install Android SDK
        run: |
          mkdir -p /sdk/cmdline-tools
          cd /sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip
          mv cmdline-tools cmdline-tools/latest

          yes | /sdk/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=/sdk \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # -----------------------------
      # local.properties (CRITICAL)
      # -----------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=/sdk" > android/local.properties

      # -----------------------------
      # gradle.properties (ANDROIDX FIX)
      # -----------------------------
      - name: Write gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF

      # -----------------------------
      # Permissions
      # -----------------------------
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # -----------------------------
      # BUILD APK (NO CLEAN)
      # -----------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew :app:assembleDebug

      # -----------------------------
      # VERIFY APK
      # -----------------------------
      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # -----------------------------
      # UPLOAD TO GITHUB RELEASE
      # -----------------------------
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
