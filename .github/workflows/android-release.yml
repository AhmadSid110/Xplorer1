name: Android Release Build

on:
  push:
    tags:
      - "v*.*.*"   # v1.0.0, v1.2.3 etc

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for tags

      # -------------------------
      # Extract version from tag
      # -------------------------
      - name: Extract version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      # -------------------------
      # Java 17 (MATCHES MODAL)
      # -------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
      # Android SDK (MANUAL, STABLE)
      # -------------------------
      - name: Install Android SDK
  run: |
    mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    cd $ANDROID_SDK_ROOT/cmdline-tools

    curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
    unzip tools.zip
    mv cmdline-tools latest

    yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
      --sdk_root=$ANDROID_SDK_ROOT \
      "platform-tools" \
      "platforms;android-34" \
      "build-tools;34.0.0"

      # -------------------------
      # Local properties (CRITICAL)
      # -------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # -------------------------
      # Gradle properties (ANDROIDX FIX)
      # -------------------------
      - name: Ensure gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2g
          EOF

      # -------------------------
      # Build APK (NO CLEAN)
      # -------------------------
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            -PversionName=$APP_VERSION

      # -------------------------
      # Verify APK
      # -------------------------
      - name: Verify APK output
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # -------------------------
      # Upload to GitHub Release
      # -------------------------
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
