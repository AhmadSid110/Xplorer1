name: Android Build & Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # ─────────────────────────────────────────────
      # 1️⃣ Checkout
      # ─────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2️⃣ Resolve version
      # ─────────────────────────────────────────────
      - name: Resolve version
        run: |
          COMMITS=$(git rev-list --count HEAD)
          VERSION_NAME="1.0.${COMMITS}"
          VERSION_CODE="${COMMITS}"

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "VersionName=$VERSION_NAME"
          echo "VersionCode=$VERSION_CODE"

      # ─────────────────────────────────────────────
      # 3️⃣ Java 17
      # ─────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ─────────────────────────────────────────────
      # 4️⃣ Android SDK (FIXED)
      # ─────────────────────────────────────────────
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip

          rm -rf cmdline-tools temp
          mkdir temp

          unzip -q tools.zip -d temp
          mkdir -p cmdline-tools/latest
          mv temp/cmdline-tools/* cmdline-tools/latest/

          rm -rf temp tools.zip

          yes | cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ─────────────────────────────────────────────
      # 5️⃣ local.properties
      # ─────────────────────────────────────────────
      - run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ─────────────────────────────────────────────
      # 6️⃣ gradle.properties
      # ─────────────────────────────────────────────
      - run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          EOF

      # ─────────────────────────────────────────────
      # 7️⃣ Build APK
      # ─────────────────────────────────────────────
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Build Signed Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: release.jks
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName=$VERSION_NAME \
            -PversionCode=$VERSION_CODE \
            --no-daemon

      # ─────────────────────────────────────────────
      # 8️⃣ Upload APK (ONLY on main)
      # ─────────────────────────────────────────────
      - name: Upload APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ env.VERSION_CODE }}
          name: Xplorer ${{ env.VERSION_NAME }}
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk