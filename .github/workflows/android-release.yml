name: Android Build & Release

on:
  push:
    branches:
      - "**"        # run on every commit
    tags:
      - "v*.*.*"    # release on tags
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      # ─────────────────────────────────────────────
      # 1️⃣ Checkout
      # ─────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2️⃣ Resolve version (tag → release, commit → dev)
      # ─────────────────────────────────────────────
      - name: Resolve version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            VERSION_NAME="$TAG"
          else
            VERSION_NAME="dev-${GITHUB_RUN_NUMBER}"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

          echo "VersionName=$VERSION_NAME"
          echo "VersionCode=$VERSION_CODE"

      # ─────────────────────────────────────────────
      # 3️⃣ Java 17
      # ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ─────────────────────────────────────────────
      # 4️⃣ Android SDK (FIXED – NO SELF MOVE)
      # ─────────────────────────────────────────────
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$ANDROID_SDK_ROOT"

          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip

          rm -rf cmdline-tools temp
          mkdir temp

          unzip -q tools.zip -d temp

          mkdir -p cmdline-tools/latest
          mv temp/cmdline-tools/* cmdline-tools/latest/

          rm -rf temp tools.zip

          yes | cmdline-tools/latest/bin/sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # ─────────────────────────────────────────────
      # 5️⃣ local.properties
      # ─────────────────────────────────────────────
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # ─────────────────────────────────────────────
      # 6️⃣ gradle.properties (NO kotlin.version here)
      # ─────────────────────────────────────────────
      - name: Write gradle.properties
        run: |
          cat <<EOF > android/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
          EOF

      # ─────────────────────────────────────────────
      # 7️⃣ Build APK
      # ─────────────────────────────────────────────
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PversionName=$VERSION_NAME \
            -PversionCode=$VERSION_CODE \
            --no-daemon

      # ─────────────────────────────────────────────
      # 8️⃣ Verify APK
      # ─────────────────────────────────────────────
      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # ─────────────────────────────────────────────
      # 9️⃣ Upload APK (ONLY on tags)
      # ─────────────────────────────────────────────
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Xplorer v${{ env.VERSION_NAME }}
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk