name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

      # 🔒 CRITICAL: Keep Gradle cache inside workspace
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Java 17
      # -------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # -------------------------
      # Cache Gradle (MOST IMPORTANT STEP)
      # -------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            .gradle
          key: gradle-${{ runner.os }}-8.2
          restore-keys: |
            gradle-${{ runner.os }}

      # -------------------------
      # Android SDK
      # -------------------------
      - name: Install Android SDK
  run: |
    mkdir -p "$ANDROID_SDK_ROOT"

    if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
      cd "$ANDROID_SDK_ROOT"

      curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
      unzip -q tools.zip

      mkdir -p cmdline-tools/latest
      mv cmdline-tools/* cmdline-tools/latest/

      rm -rf tools.zip
    fi

    yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
      --sdk_root="$ANDROID_SDK_ROOT" \
      "platform-tools" \
      "platforms;android-34" \
      "build-tools;34.0.0"

      # -------------------------
      # local.properties
      # -------------------------
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # -------------------------
      # 🔥 PRE-WARM GRADLE (THIS IS THE FIX)
      # -------------------------
      - name: Prewarm Gradle (downloads Kotlin ONCE)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon

      # -------------------------
      # Build APK
      # -------------------------
      - name: Assemble Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      # -------------------------
      # Verify APK
      # -------------------------
      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk

      # -------------------------
      # Upload APK to GitHub Release (tags only)
      # -------------------------
      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk